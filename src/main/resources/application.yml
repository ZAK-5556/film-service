spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/films}
    username: ${DB_USERNAME:films}
    password: ${DB_PASSWORD:films}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3050}
